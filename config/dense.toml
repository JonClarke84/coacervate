# The `dense` profile: the same world, the same light, a quarter of the water.
#
# ⭐ **This exists to ask one question — does a feeding-strategy split appear when bodies
# actually meet each other?** SPEC section 6 makes predation emergent rather than scripted, and
# half a million ticks of the `default` profile produced one devorocyte in a population of 794.
# The diagnostic reason is not that eating is a bad living; it is that in the shipped world a
# body hardly ever touches a stranger.
#
# ⚠️⚠️ **CORRECTED. This file claimed 13.5% rising to 58.8%, and eight times the predation. None
# of the three reproduces.** Re-measured with `assay.rs`'s `what_a_mouth_meets`, 60,000 ticks,
# seed 42, 32 devorocyte-carrying founders, this profile against `default.toml`:
#
#   contact fraction   0.4723 -> 0.5274   (x1.12, not 13.5% -> 58.8%)
#   predation          x1.09              (not x8)
#   stranger share     0.0004 -> 0.0463   (x116)
#
# The open-world figure is the one to trust: **0.4723 reproduces to four decimals** against the
# committed assertion in `a_current_buys_strangers_by_spending_contact`, so it is Phase 4's
# 13.5% that is wrong rather than the re-measurement. Bodies were never rarely in contact; they
# were in contact with **their own descendants**, which is a quite different fact and one no
# amount of density changes much.
#
# ⭐ **What density actually buys is the stranger share, and it buys a great deal of it: x116.**
# That is the statistic neither this file nor `main.rs` quoted, and it is the one the profile
# should have been read against all along — a mouth in the shipped world meets a foreign lineage
# four times in ten thousand contacts, and here it meets one about once in twenty. ⚠️ It is
# still not enough: `assay.rs`'s invasion analysis puts a third devorocyte at nought
# establishments out of thirty-six introductions, including a world at three quarters strangers.
# See `docs/NEXT.md`.
#
# Everything below is `default.toml` with three numbers changed, and the reasoning for each is
# beside it. Read `default.toml` for what the rest of them mean; the comments there are the
# document and are deliberately not copied.

[world]
seed = 42
width = 2048.0           # ⚠️ NOT shrunk, and this is the one line in the file that must not be
                         # edited without reading SPEC section 8. Springs are resolved from a
                         # flat list rather than found by the spatial hash, and they have no
                         # length limit — so a spring between two cells on opposite sides of the
                         # world works, and hauls them together *through the seam*. A body may
                         # hold 64 cells and a gene's rest length may reach MAX_REST_LENGTH,
                         # which is 13.6 units, so a chain can be 870 units long. In a world
                         # narrower than about 1,200 units that chain reaches more than half way
                         # round, and SPEC's warning stops being hypothetical. The density comes
                         # out of the height instead.
height = 288.0           # ⭐ A quarter of the shipped 1,152, which is the whole of the change:
                         # the same population in a quarter of the water.
grid_cols = 256
grid_rows = 36           # A quarter of 144, so a tile is still 8 by 8 world units and nothing
                         # about the resource field's resolution has changed.
years_per_tick = 1000.0

[light]
# ⭐⭐⭐ `uptake` sets the GRAIN of the field, not its wealth. It was a compiled-in constant
# for eleven rounds and was never swept. At equilibrium total uptake equals total influx
# whatever it is, so it cannot change carrying capacity or a photocyte's mean income -- it
# changes only how far a tile is pulled down to get there, which is the only spatial
# structure a body could ever exploit. See config.rs's LightConfig::uptake.
uptake = 0.01
# ⭐⭐⭐ `bloom` puts light.patchiness into the light's SUPPLY rather than only its ceiling.
# Until it existed the light arrived uniformly at every tile of a given depth, so the world had
# no horizontal structure in supply at all. Ships at nought. See config.rs's LightConfig::bloom.
bloom = 0.0
influx = 0.004           # ⭐ Four times the shipped 0.001, over a quarter as many tiles, so the
                         # world is offered **exactly the same total energy per tick** as the
                         # `default` profile: 9,216 tiles x 0.004 against 36,864 x 0.001. SPEC
                         # section 4 makes carrying capacity proportional to the total, so this
                         # is a denser population rather than a richer one.
                         #
                         # ⚠️ **Do not raise it further to hold the population up.** The count
                         # does fall here, and it falls because bodies packed four times as
                         # close shade one another and eat out of one another's tiles — which is
                         # the pressure this profile exists to apply. Compensating for it with
                         # more light is Phase 4's measured mistake: at an influx that outruns
                         # the metabolism the arena binds first, every birth that fails does so
                         # for a reason unconnected to how well its parent was doing, and drift
                         # is the only force left acting. See SPEC section 3.
cap = 8.0
gradient = 0.75          # Unchanged, so the light still falls by three quarters from surface to
                         # floor — over a quarter of the depth, which makes the gradient a
                         # sensocyte reads four times as steep as the shipped world's.
patchiness = 0.5         # `default.toml`'s, unchanged. The blotches are the same fraction of
                         # each tile's ceiling here as there.
patch_drift = 0.0006     # `default.toml`'s, unchanged, and deliberately not scaled with the
                         # light. It is a *speed a body has to match*, measured against what
                         # swimming and budding can do, and neither of those got faster when
                         # the water got shallower.
diffusion = 0.04
season_period = 21000    # `default.toml`'s, unchanged. ⚠️ The floor is `cap / influx`, which in
                         # this world is 2,000 rather than 8,000 — a quarter, because the light
                         # is four times as bright — so a season here could legitimately run four
                         # times as fast. It does not, for the reason `patch_drift` does not
                         # scale either: this profile exists to ask one question about density,
                         # and a preset that quietly also changed the weather would be an
                         # experiment with two variables in it.
season_amplitude = 0.0   # `default.toml`'s, unchanged, and inert here for the same reason.
shadow_depth = 27.2      # ⚠️ `default.toml`'s, unchanged, and **deliberately not scaled with the
shadow_spread = 0.0      # water**. A shadow's reach is a length in world units, and this profile
                         # exists to ask what happens when bodies are packed into a quarter of the
                         # depth *under the occlusion the shipped world already has*. That is what
                         # makes the density measurements in docs/NEXT.md comparable with the
                         # shipped ones; a profile that also opened the shadow out would be an
                         # experiment with two variables in it.

[physics]
drag = 0.92
drag_anisotropy = 2.0
collision_stiffness = 40.0
spring_damping = 0.35
current = 0.0
thrust = 0.0

[behaviour]
resting_amplitude = 0.8  # `default.toml`'s, unchanged. What a muscle is worth is not a
stroke = 1.0             # property of how much water there is.

[metabolism]
# ⭐⭐⭐ `tissue_share` locks this fraction of a body's construction cost into its tissue at
# birth: unspendable, unreachable by upkeep, released to detritus when it dies and drainable
# by a mouth. Ships at nought. See config.rs's MetabolismConfig::tissue_share.
tissue_share = 0.0
upkeep_scale = 1.0
scaling_exponent = 1.0
gene_cost = 0.0001
movement_cost = 0.0001
reproduction_threshold = 2.2
offspring_share = 0.45

[mutation]
point_rate = 0.06
point_sigma = 0.12
duplication_rate = 0.02
deletion_rate = 0.02
insertion_rate = 0.01
reorder_rate = 0.02
genome_duplication_rate = 0.0008

[limits]
max_organisms = 4000
max_cells_per_organism = 64
max_genes = 128
max_dev_steps = 16

[run]
max_wall_clock_hours = 12.0
max_ticks = 0
max_ticks_per_second = 0
reseed_on_extinction = false
