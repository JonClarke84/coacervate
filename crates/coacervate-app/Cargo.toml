[package]
name = "coacervate-app"
version.workspace = true
edition.workspace = true

# Note the absence of serde. The config types and their derives live in coacervate-sim;
# this crate needs only the file format. That absence is where CLAUDE.md's "the
# simulation crate does no I/O" boundary is actually enforced.
[dependencies]
coacervate-sim = { workspace = true }
toml = { workspace = true }

# Test-only. `the_bundled_config_seeds_the_world_rng` has to actually draw numbers from
# the generator the config produced, and drawing needs rand's `Rng` trait in scope. The
# binary's own code never touches rand.
[dev-dependencies]
rand = { workspace = true }

[lints]
workspace = true
